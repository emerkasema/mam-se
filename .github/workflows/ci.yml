name: CI

on:
  pull_request:
  push:
    branches: [main, miccy-main, miccy-dev, 'codex-*']
  workflow_call:
    inputs:
      app_base:
        type: string
        default: /mam-se/
      pages_artifact:
        type: boolean
        default: false

permissions:
  contents: read

env:
  PUBLIC_APP_BASE: ${{ inputs.app_base || '/mam-se/' }}
  ASTRO_TELEMETRY_DISABLED: '1'
  TZ: UTC

jobs:
  functional:
    name: CI / Linux functional and integration
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run check
      # build zahrnuje SW manifest; dist/ se po testech znovu nesestavuje.
      - run: bun run build
      - run: bun run test
      - run: bunx --no-install playwright install --with-deps chromium firefox webkit
      # Darwin baseline se v Linuxu neporovnává ani nevytváří.
      - run: bun run test:e2e --grep-invert 'upstream visual baseline'
      - run: bun run build:integration
      - run: bun run test:integration
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: ${{ inputs.pages_artifact }}
        with:
          path: dist
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: linux-test-diagnostics
          path: test-results/
          if-no-files-found: ignore
          retention-days: 3

  visual:
    name: CI / macOS visual baseline
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bunx --no-install playwright install chromium
      - run: bun run test:e2e --project chromium --grep 'upstream visual baseline'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: macos-visual-diagnostics
          path: test-results/e2e/
          if-no-files-found: ignore
          retention-days: 3
